server {
    listen 8080;

    server_tokens off;

    # --- Security headers ---
    # NOTE: the SPA calls the backend at VITE_BACKEND_URL (baked in at build
    # time). connect-src and img-src MUST include that origin. They currently
    # allow any https: origin as a placeholder; for a tighter policy replace
    # "https:" in both with the exact backend origin (e.g. https://api.example.com).
    # If the backend is served over plain http on another origin, add it there too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # No trailing slash on proxy_pass: the /api prefix is preserved, since the
    # server mounts its routes at /api/*.
    location /api/ {
        proxy_pass http://server:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
