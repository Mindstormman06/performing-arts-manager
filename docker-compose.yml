services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pam-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - VITE_BACKEND_URL=http://localhost:8050
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  client_node_modules:

