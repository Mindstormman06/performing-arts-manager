name: Node.js CI

on:
  push:
    branches: [ main, 276_a02 ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron '0 7 * * *'

jobs:
  lint-and-format-server:
    runs-on: ubuntu-latest
    steps:

      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Create directory for linting reports
      - name: Create Report Directory
        working-directory: ./server
        run: mkdir -p ./linting-reports

      # Biome Check
      - name: Run Biome
        working-directory: ./server
        run: npx @biomejs/biome ci . > ./linting-reports/biome-report.txt

      # ESLint Check
      - name: Run ESLint
        working-directory: ./server
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      # Upload linting reports as artifacts
      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-lint-reports
          path: ./server/linting-reports/
          retention-days: 28

  test-server:
    # Only run on successful lint
    needs: lint-and-format-server
    runs-on: ubuntu-latest

    steps:

      # Cechkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Run tests with coverage using vitest
      - name: Run Tests
        working-directory: ./server
        run: npm run coverage
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DIALECT: ${{ secrets.DB_DIALECT }}
          DB_SSL: ${{ secrets.DB_SSL }}

      # Upload coverage report as artifact
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          path: ./server/coverage/
          retention-days: 28

  bdd-tests:
    needs: test-server
    runs-on: ubuntu-latest

    steps:

      # Cechkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Run BDD tests with Cucumber
      - name: Run Cucumber BDD Tests
        working-directory: ./server
        run: npm run test:bdd
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DIALECT: ${{ secrets.DB_DIALECT }}
          DB_SSL: ${{ secrets.DB_SSL }}

      # Upload Cucumber report
      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: ./server/reports/
          retention-days: 28

  server-security:
    runs-on: ubuntu-latest
    needs: lint-and-format-server
    steps:

      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install Dependencies
        working-directory: ./server
        run: npm install

      # Run Retire to check for vulnerable dependencies
      - name: Run Retire (SCA)
        working-directory: ./server
        run: npm run retire > retire-output.txt

      # Upload security report as artifact
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-security-report
          path: ./server/retire-output.txt
          retention-days: 28




  lint-and-format-client:
    runs-on: ubuntu-latest
    steps:

      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./client
        run: npm install

      # Create directory for linting reports
      - name: Create Report Directory
        working-directory: ./client
        run: mkdir -p ./linting-reports

      # Biome Check
      - name: Run Biome
        working-directory: ./client
        run: npm run biome > ./linting-reports/biome-report.txt

      # ESLint Check
      - name: Run ESLint
        working-directory: ./client
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      # Upload linting reports as artifacts
      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-lint-reports
          path: ./client/linting-reports/
          retention-days: 28

  test-client-ui:
    needs: lint-and-format-client
    runs-on: ubuntu-latest

    steps:

      # Chechkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./client
        run: npm install

      # Run UI tests with Playwright
      - name: Run Playwright UI Tests
        working-directory: ./client
        run: npm run test:ui

      # Upload Playwright report as artifact
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-ui-test-report
          path: ./client/playwright-report/
          retention-days: 28

  uat-tests:
    needs: [bdd-tests, test-client-ui]
    runs-on: ubuntu-latest

    steps:
      # Chechkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.12

      # Install client and server node deps
      - name: Install Node Dependencies
        run: |
          cd server && npm install
          cd ../client && npm install

      # Install Robot Framework and Browser library for UAT
      - name: Install Robot Framework and Browser
        working-directory: ./uat
        run: |
          pip install robotframework robotframework-browser
          rfbrowser init

      # Run UAT tests with Robot Framework
      - name: Start Background Servers & Run UAT
        run: |
          # Start the backend in the background
          cd server && npm run dev && npm run seed &
          # Start the frontend in the background
          cd ../client && npm run dev &
          # Wait for servers to spin up
          sleep 10
          # Seed the DB and run Robot
          cd ../uat
          robot .
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DIALECT: ${{ secrets.DB_DIALECT }}
          DB_SSL: ${{ secrets.DB_SSL }}

      # Upload UAT report as artifact
      - name: Upload UAT Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-report
          path: ./uat/report.html
          retention-days: 28

  build-server:
    runs-on: ubuntu-latest
    needs: uat-tests
    steps:

      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install only production dependencies
      - name: Install Production Dependencies
        working-directory: ./server
        run: npm install --omit=dev

      # Delete dev files
      - name: Clean Dev Files
        working-directory: ./server
        run: |
          rm -rf ./tests/
          rm -f biome.json eslint.config.js vitest.config.js

      # Upload artifact of ./server directory for deployment
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: ./server/
          retention-days: 28


  deploy-docker:
    runs-on: ubuntu-latest
    needs: build-server
    steps:

      # Download the build artifact from previous job
      - name: Download Build Artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: server-build
          path: ./server-deploy

      # Setup Docker environment
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      # Build Docker image
      - name: Build Docker Image
        uses: docker/build-push-action@v6.19.2
        with:
          context: ./server-deploy
          tags: performing-arts-manager-server:latest
          push: false
          load: true

      # Verify that the Docker image was built successfully
      - name: Verify Image
        run: docker images | grep performing-arts-manager-server
