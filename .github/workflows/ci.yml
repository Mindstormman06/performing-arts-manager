name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Create Report Directory
        working-directory: ./server
        run: mkdir -p ./linting-reports


      # 1. Biome Check
      - name: Run Biome
        working-directory: ./server
        run: npx @biomejs/biome ci . > ./linting-reports/biome-report.txt

      # 2. ESLint Check
      - name: Run ESLint
        working-directory: ./server
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-lint-reports
          path: ./server/linting-reports/
          retention-days: 28

  test-server:
    # Only run on successful lint
    needs: lint-and-format-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Run Tests
        working-directory: ./server
        run: npm run coverage
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DIALECT: ${{ secrets.DB_DIALECT }}
          DB_SSL: ${{ secrets.DB_SSL }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          path: ./server/coverage/
          retention-days: 28

  server-security:
    runs-on: ubuntu-latest
    needs: lint-and-format-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        working-directory: ./server
        run: npm install

      - name: Run Retire (SCA)
        working-directory: ./server
        run: npm run retire > retire-output.txt

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-security-report
          path: ./server/retire-output.txt
          retention-days: 28

  build-server:
    runs-on: ubuntu-latest
    needs: [lint-and-format-server, server-security, test-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Production Dependencies
        working-directory: ./server
        run: npm install --omit=dev

      - name: Clean Dev Files
        working-directory: ./server
        run: |
          rm -rf ./tests/
          rm -f biome.json eslint.config.js vitest.config.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: ./server/
          retention-days: 28


  lint-and-format-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Create Report Directory
        working-directory: ./client
        run: mkdir -p ./linting-reports

      # 1. Biome Check
      - name: Run Biome
        working-directory: ./client
        run: npx @biomejs/biome ci . > ./linting-reports/biome-report.txt


      # 2. ESLint Check
      - name: Run ESLint
        working-directory: ./client
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-lint-reports
          path: ./client/linting-reports/
          retention-days: 28