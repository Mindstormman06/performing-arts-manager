name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'

jobs:
  # =====================
  # SERVER JOBS
  # =====================
  lint-and-format-server:
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Create directory for linting reports
      - name: Create Report Directory
        working-directory: ./server
        run: mkdir -p ./linting-reports

      # Run Biome checks
      - name: Run Biome
        working-directory: ./server
        run: npx @biomejs/biome ci . > ./linting-reports/biome-report.txt

      # Run ESLint checks
      - name: Run ESLint
        working-directory: ./server
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      # Upload linting reports as artifacts
      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-lint-reports
          path: ./server/linting-reports/
          retention-days: 28

  server-security:
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install Dependencies
        working-directory: ./server
        run: npm install

      # Run Retire to check for vulnerable dependencies
      - name: Run Retire (SCA)
        working-directory: ./server
        run: npm run retire > retire-security-output.txt

      # Run npm audit for high-severity vulnerabilities
      - name: Run NPM Audit (SCA)
        working-directory: ./server
        run: npm audit --audit-level=high > npm-audit-security-output.txt

      # Upload security report as artifact
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-security-report
          path: ./server/*security-output.*
          retention-days: 28

  test-server:
    # Run after server stage 1 passes
    needs: [ lint-and-format-server, server-security ]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: performing-arts-manager-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Run tests with coverage using Vitest
      - name: Run Tests
        working-directory: ./server
        run: npm run coverage
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: performing-arts-manager-db
          DB_PORT: 3306
          DB_DIALECT: mysql
          DB_SSL: false

      # Upload coverage report as artifact
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-coverage-report
          path: ./server/coverage/
          retention-days: 28

  bdd-tests:
    needs: [test-server, test-client-ui]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: performing-arts-manager-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./server
        run: npm install

      # Run BDD tests with Cucumber
      - name: Run Cucumber BDD Tests
        working-directory: ./server
        run: npm run test:bdd
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: performing-arts-manager-db
          DB_PORT: 3306
          DB_DIALECT: mysql
          DB_SSL: false

      # Upload Cucumber report
      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bdd-report
          path: ./server/reports/
          retention-days: 28

  # =====================
  # CLIENT JOBS
  # =====================
  lint-and-format-client:
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      # Install dependencies
      - name: Install dependencies
        working-directory: ./client
        run: npm install

      # Create directory for linting reports
      - name: Create Report Directory
        working-directory: ./client
        run: mkdir -p ./linting-reports

      # Run Biome checks
      - name: Run Biome
        working-directory: ./client
        run: npm run biome > ./linting-reports/biome-report.txt

      # Run ESLint checks
      - name: Run ESLint
        working-directory: ./client
        run: npx eslint . -f json -o ./linting-reports/eslint-report.json

      # Upload linting reports as artifacts
      - name: Upload Linting Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: client-lint-reports
          path: ./client/linting-reports/
          retention-days: 28

  client-security:
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install dependencies
      - name: Install Dependencies
        working-directory: ./client
        run: npm install

      # Run Retire to check for vulnerable dependencies
      - name: Run Retire (SCA)
        working-directory: ./client
        run: npm run retire > retire-security-output.txt

      # Run npm audit for high-severity vulnerabilities
      - name: Run NPM Audit (SCA)
        working-directory: ./client
        run: npm audit --audit-level=high > npm-audit-security-output.txt

      # Upload security report as artifact
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: client-security-report
          path: ./client/*security-output.*
          retention-days: 28

  test-client-ui:
    needs: [ client-security, lint-and-format-client]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: performing-arts-manager-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      # Install client and server dependencies
      - name: Install Node Dependencies
        run: |
          cd server && npm install
          cd ../client && npm install

      # Check for cached browsers
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          # This key ensures the cache resets if package-lock files change.
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      # Download Chromium on first run
      - name: Install Playwright Browsers and Deps
        working-directory: ./client
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install-deps chromium
          fi

      # Run UI tests with Playwright
      - name: Run Playwright UI Tests
        working-directory: ./client
        run: |
          cd ../server && node ./server.js &
          npx wait-on http://localhost:8050/server-up
          cd ../client
          npm run test
        env:
          API_PORT: 8050
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: performing-arts-manager-db
          DB_PORT: 3306
          DB_DIALECT: mysql
          DB_SSL: false

      # Upload Playwright report as artifact
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: client-ui-test-report
          path: ./client/playwright-report/
          retention-days: 28

  # =====================
  # INTEGRATION + DEPLOY
  # =====================
  uat-tests:
    needs: [ test-server, test-client-ui ]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: performing-arts-manager-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '20'

      # Set up Python environment
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      # Install client and server dependencies
      - name: Install Node Dependencies
        run: |
          cd server && npm install
          cd ../client && npm install

      # Install Robot Framework and Browser library for UAT
      - name: Install Robot Framework and Browser
        working-directory: ./uat
        run: |
          pip install robotframework robotframework-browser
          rfbrowser init

      # Run UAT tests with Robot Framework
      - name: Start Background Servers & Run UAT
        run: |
          trap 'npx --yes kill-port 8050 5173 || true' EXIT

          cd server
          node ./server.js > server.log 2>&1 &

          npx wait-on tcp:8050
          echo "Server is up!"

          node ./seed.js
          echo "Seed completed successfully!"

          cd ..
          cd client
          npm run dev &

          npx wait-on tcp:5173
          echo "Client is up!"

          cd ../uat
          robot .
        env:
          NODE_ENV: test
          API_PORT: 8050
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: performing-arts-manager-db
          DB_PORT: 3306
          DB_DIALECT: mysql
          DB_SSL: false

      # Upload UAT report as artifact
      - name: Upload UAT Report Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-report
          path: ./uat/report.html
          retention-days: 28

  build-server:
    needs: [ uat-tests, bdd-tests ]
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # Install only production dependencies
      - name: Install Production Dependencies
        working-directory: ./server
        run: npm install --omit=dev

      # Delete development files
      - name: Clean Dev Files
        working-directory: ./server
        run: |
          rm -rf ./tests/
          rm -f biome.json eslint.config.js vitest.config.js

      # Upload artifact of ./server directory for deployment
      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-build
          path: ./server/
          retention-days: 28

  build-client:
    needs: uat-tests
    runs-on: ubuntu-latest
    steps:
      # Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      # Install dependencies needed for the Vite production build
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      # Build the client
      - name: Build client
        working-directory: ./client
        run: npm run build

      # Package static assets with a runtime Dockerfile for deploy stage
      - name: Prepare client deploy package
        working-directory: ./client
        run: |
          mkdir -p ./deploy
          cp -r ./dist ./deploy/dist
          cp ./nginx.conf ./deploy/nginx.conf
          cat > ./deploy/Dockerfile <<'EOF'
          FROM nginx:alpine
          COPY dist /usr/share/nginx/html
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # Upload build artifact
      - name: Upload client build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: client-build
          path: ./client/deploy/
          retention-days: 28

  deploy-docker:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      # Download the build artifacts from the previous jobs
      - name: Download Server Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: server-build
          path: ./server-deploy

      - name: Download Client Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: client-build
          path: ./client-deploy

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set up Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # Build server Docker image
      - name: Build Server Docker Image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./server-deploy
          tags: ${{ secrets.DOCKER_USERNAME }}/performing-arts-manager:server-latest
          push: true
          load: true

      # Build client Docker image
      - name: Build Client Docker Image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./client-deploy
          tags: ${{ secrets.DOCKER_USERNAME }}/performing-arts-manager:client-latest
          push: true
          load: true

      # Verify that both Docker images were built successfully
      - name: Verify Images
        run: |
          docker images | grep performing-arts-manager
